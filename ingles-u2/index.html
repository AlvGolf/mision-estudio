<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misión Inglés · Unit 2</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1b3d;--card:#1b2b5c;--card2:#24387a;--yes:#2ecc71;--no:#ff5c5c;--gold:#ffc83d;--txt:#fff;--mut:#b8c4ee;--acc:#3dd6ff}
*{box-sizing:border-box}
body{margin:0;font-family:'Fredoka',system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#2a3f8f 0,#0f1b3d 60%);color:var(--txt);min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(15,27,61,.92);backdrop-filter:blur(6px);border-bottom:2px solid #2a3f8f}
header h1{font-size:18px;margin:0;cursor:pointer}
.hud{display:flex;gap:10px;font-weight:600}
.pill{background:var(--card2);padding:6px 12px;border-radius:999px;font-size:15px}
main{max-width:820px;margin:0 auto;padding:18px 14px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mission{background:var(--card);border:3px solid transparent;border-radius:20px;padding:18px;cursor:pointer;transition:.15s;text-align:left;color:var(--txt);font-family:inherit}
.mission:hover{transform:translateY(-3px);border-color:var(--acc)}
.mission .ic{font-size:40px}
.mission h3{margin:6px 0 4px;font-size:20px}
.mission p{margin:0;color:var(--mut);font-size:14px}
.stars{margin-top:8px;font-size:18px;letter-spacing:2px}
.box{background:var(--card);border-radius:22px;padding:22px;margin-top:12px}
h2{margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 14px}
.q{font-size:22px;font-weight:600;margin:10px 0 16px;line-height:1.35}
.hint{color:var(--mut);font-size:15px;margin-top:-8px;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{font-family:inherit;font-size:19px;padding:14px;border-radius:14px;border:3px solid #34509f;background:var(--card2);color:var(--txt);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--acc)}
.opt.ok{background:var(--yes);border-color:var(--yes)}
.opt.bad{background:var(--no);border-color:var(--no)}
.fb{min-height:28px;margin-top:12px;font-size:17px}
.btn{font-family:inherit;font-size:18px;font-weight:600;padding:12px 22px;border-radius:14px;border:0;background:var(--acc);color:#06243a;cursor:pointer;margin-top:12px}
.btn.sec{background:var(--card2);color:var(--txt)}
.bar{height:10px;background:#0c1633;border-radius:9px;overflow:hidden;margin-bottom:8px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));transition:.3s}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border-radius:14px;background:#0c1633;margin-bottom:10px}
.chip{font-family:inherit;font-size:19px;padding:10px 14px;border-radius:12px;border:0;background:var(--gold);color:#3a2700;font-weight:600;cursor:pointer}
.chip.used{opacity:.25;pointer-events:none}
input.typ{font-family:inherit;font-size:20px;padding:12px;border-radius:12px;border:3px solid #34509f;background:#0c1633;color:#fff;width:100%;margin-bottom:10px}
input.typ.ok{border-color:var(--yes)} input.typ.bad{border-color:var(--no)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:14px;color:var(--mut);margin-bottom:4px}
.therm{display:grid;grid-template-columns:70px 1fr;gap:6px 12px;align-items:center;margin:10px 0 16px}
.therm .pct{font-weight:700;text-align:right}
.therm .w{padding:8px 12px;border-radius:10px;font-weight:600}
.flash{perspective:900px;height:200px;cursor:pointer;margin:8px 0}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;font-weight:700;background:var(--card2);text-align:center;padding:10px}
.flash .b{transform:rotateY(180deg);background:#2e7d5b;font-size:24px}
.flash small{font-size:16px;font-weight:400;color:var(--mut)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:1.2;border-radius:14px;border:0;font-family:inherit;font-size:15px;font-weight:600;background:var(--card2);color:transparent;cursor:pointer;padding:4px}
.mc.open{background:#fff;color:#17224a}
.mc.done{background:var(--yes);color:#fff;pointer-events:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{font-family:inherit;font-size:15px;padding:8px 14px;border-radius:999px;border:2px solid #34509f;background:transparent;color:#fff;cursor:pointer}
.tab.on{background:var(--acc);color:#06243a;border-color:var(--acc)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:60px;text-align:center}
.center{text-align:center}
table.rules{width:100%;border-collapse:collapse;font-size:16px;margin:8px 0}
table.rules td{padding:8px;border-bottom:1px solid #34509f;vertical-align:top}
.conf{position:fixed;top:-20px;font-size:24px;animation:fall 1.6s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.t-short{display:none}
.sect{grid-column:1/-1;font-size:19px;font-weight:700;margin:10px 2px -4px;color:var(--gold)}
.pill{white-space:nowrap}
.rk-list{margin:8px 0}
.rk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #34509f}
.rk-m{font-size:24px;width:36px;flex:none;text-align:center}
.rk-b{flex:1;min-width:0}
.rk-n{font-weight:700;font-size:18px}
.rk-n small{font-weight:400;color:var(--mut);font-size:13px}
.rk-s{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0;font-size:16px}
.rk-st{font-size:14px}
.rk .fdel{flex:none}
@media(max-width:600px){
 header{padding:8px 10px}
 header h1{font-size:17px}
 .t-long{display:none}.t-short{display:inline}
 .hud{gap:6px}.pill{font-size:14px;padding:5px 10px}
 main{padding:12px 10px 50px}
 .box{padding:16px;border-radius:18px}
 .grid{grid-template-columns:1fr 1fr;gap:10px}
 .mission{padding:12px;border-radius:16px}
 .mission .ic{font-size:30px}
 .mission h3{font-size:16px}
 .mission p{font-size:12px}
 .mission .stars{font-size:15px;margin-top:4px}
 .q{font-size:19px}.opt{font-size:17px;padding:12px}
 .mc{font-size:12px}
 .row2{grid-template-columns:1fr}
 .row2 .btn{margin-top:0}
 .flash{height:170px}.flash .f{font-size:26px}.flash .b{font-size:19px}
 .chip{font-size:17px;padding:9px 12px}
 .big{font-size:48px}
 .btn{font-size:17px;padding:12px 18px}
 table.rules{font-size:15px}
}
@media(min-width:601px) and (max-width:1024px){
 main{max-width:760px}
 .grid{grid-template-columns:repeat(3,1fr)}
}

</style>
</head>

 {k:'vtest',n:'Vocabulario: traducción',w:1},{k:'vfrase',n:'Vocabulario en frases',w:1},{k:'traps',n:'Cazaerrores',w:0.5}];
function grade(k,n){n=Math.round(n*10)/10;(GR[k]=GR[k]||[]).push(n);if(GR[k].length>3)GR[k].shift();save();return n}
function nota(k){const a=GR[k];return a&&a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:null}
function finalNota(){let s=0,w=0,miss=0;BLOCKS.forEach(b=>{const n=nota(b.k);if(n==null)miss++;else{s+=n*b.w;w+=b.w}});return{n:w?Math.round(s/w*10)/10:null,miss}}
function label(n){return n==null?'Sin datos':n<5?'Insuficiente':n<6?'Suficiente':n<7?'Bien':n<9?'Notable':'Sobresaliente'}
function sem(n){return n==null?'⚪':n>=8?'🟢':n>=5?'🟡':'🔴'}
const fmt=n=>n==null?'–':n.toFixed(1).replace('.',',');
function hoyToca(){
  const miss=BLOCKS.find(b=>nota(b.k)==null);if(miss)return{b:miss,why:'aún no lo has jugado'};
  const w=[...BLOCKS].sort((a,b)=>nota(a.k)-nota(b.k))[0];return nota(w.k)>=8?null:{b:w,why:'es tu nota más baja'};}

function quiz(title,sub,qs,key,after){
  let i=0,ok=0;qs=qs.map(q=>({...q,opts:shuf(q.opts)}));
  function show(){
    if(i>=qs.length)return end();
    const q=qs[i];
    app().innerHTML=`<div class="box"><h2>${title}</h2><p class="sub">${sub}</p>
    <div class="bar"><div style="width:${i/qs.length*100}%"></div></div>
    <div class="hint">Pregunta ${i+1} de ${qs.length}</div>
    <div class="q">${esc(q.q)}</div><div class="opts">${q.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div><div id="nx"></div></div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent==q.a)x.classList.add('ok')});
      if(b.textContent==q.a){ok++;win();$('#fb').innerHTML='✅ ¡Correcto! '+(q.ex?'<span style="color:var(--mut)">'+esc(q.ex)+'</span>':'')}
      else{b.classList.add('bad');b.classList.add('shake');lose();$('#fb').innerHTML='❌ Era: <b>'+esc(q.a)+'</b>. '+(q.ex?esc(q.ex):'')}
      $('#nx').innerHTML='<button class="btn">Siguiente ➜</button>';$('#nx .btn').onclick=()=>{i++;show()};
    });
  }
  function end(){const p=ok/qs.length;setBest(key,p);const g=MAP[key]?grade(key,p*10):null;if(p>=.7)confetti();
    app().innerHTML=`<div class="box center"><div class="big">${p>=.9?'🏆':p>=.7?'🥈':p>=.5?'👍':'💪'}</div>
    <h2>${ok} de ${qs.length}</h2>${g!=null?`<p style="font-size:22px;margin:4px">Nota: <b>${fmt(g)}</b> · ${label(g)} ${sem(g)}</p>`:''}<div class="stars" style="font-size:34px;color:var(--gold)">${'★'.repeat(starsFor(p))}${'☆'.repeat(3-starsFor(p))}</div>
    <p class="sub">${p>=.9?'¡Nivel experto!':p>=.7?'¡Muy bien! Repite para las 3 estrellas.':'Repite la misión, a la segunda sale mejor.'}</p>
    <button class="btn" id="again">🔁 Repetir</button> <button class="btn sec" onclick="home()">🏠 Menú</button></div>`;
    $('#again').onclick=after;}
  show();
}

const API_URL='https://script.google.com/macros/s/AKfycbw7rxTYPt-c99ucT8Rxjcwj1_gMRJkSq0mmjagZlZjuOnpyWtTjAFE299CbkA2MViuwaQ/exec';   /* URL del script de Google (se rellena al montar) */
const GAME_ID='ingles-u2';
let CLASS=[],CLASS_STATE='cargando';
function loadClass(){
  if(!API_URL){CLASS_STATE='sin';return}
  fetch(API_URL+'?juego='+GAME_ID).then(r=>r.json()).then(d=>{
    const last={};(d.rows||[]).forEach(x=>{const k=String(x.nombre).trim().toLowerCase();if(!last[k]||x.fecha>last[k].fecha)last[k]=x});
    CLASS=Object.values(last).map(x=>({n:x.nombre,nota:x.nota===''?null:+x.nota,ex:x.examen===''?null:+x.examen,xp:+x.xp,st:+x.estrellas,bs:+x.racha,sb:x.desglose?Object.fromEntries(MIC.map(([k],i)=>[k,+String(x.desglose).replace(/\D/g,'')[i]||0])):null,f:x.fecha}));
    CLASS_STATE='ok';const c=$('#clase');if(c){c.outerHTML=classBox();wireClass();if(window._msg){$('#sfb').textContent=window._msg;window._msg=''}}
  }).catch(()=>{CLASS_STATE='err';const c=$('#clase');if(c){c.outerHTML=classBox();wireClass()}});
}
function chk(s){let x=7;for(const c of s)x=(x*31+c.charCodeAt(0))%1679616;return x.toString(36).toUpperCase().padStart(4,'0')}
function classBox(){
  if(CLASS_STATE!='ok')return `<div class="box" id="clase"><h2>🏫 Ranking de la clase</h2><p class="sub">${CLASS_STATE=='cargando'?'Cargando el ranking… ⏳':CLASS_STATE=='sin'?'El ranking aún no está conectado.':'No se ha podido cargar el ranking. Prueba a recargar dentro de un rato.'}</p>${importBox()}</div>`;
  const rows=[...CLASS].sort((a,b)=>(b.nota??-1)-(a.nota??-1)||b.xp-a.xp);
  const med=['🥇','🥈','🥉'];
  return `<div class="box" id="clase"><h2>🏫 Ranking de la clase</h2>
  <p class="sub">Pulsa 📤 para subir tu marca. Ordenado por nota; si empatan, por XP. <button class="tab" id="crel" style="font-size:12px;padding:3px 10px">🔄 actualizar</button></p>
  ${rows.length?`<div class="rk-list">${rows.map((r,i)=>`<div class="rk"><div class="rk-m">${med[i]||(i+1)+'.'}</div><div class="rk-b"><div class="rk-n">${esc(r.n)}</div><div class="rk-s"><span>📊 <b>${r.nota!=null?fmt(r.nota):'–'}</b></span><span>👑 ${r.ex!=null?fmt(r.ex):'–'}</span><span>⭐ ${r.xp}</span><span>★ ${r.st}/24</span><span>🔥 ${r.bs}</span></div>${r.sb?`<div class="rk-st">${starLine(r.sb)}</div>`:''}</div></div>`).join('')}</div>`
  :'<p style="font-size:18px">Todavía no hay nadie. ¡Juega, pulsa 📤 y sé el primero!</p>'}
  <button class="btn" id="fsend">📤 Subir mi marca al ranking</button>
  <div class="fb" id="sfb"></div>${importBox()}</div>`;
}
function importBox(){return `<details style="margin-top:14px"><summary style="cursor:pointer;color:var(--mut)">📥 ¿Jugabas en la página antigua? Trae tu progreso</summary>
  <p class="sub" style="margin-top:8px">En la página antigua pulsa <b>📦 Pasar mi progreso</b>, copia el código y pégalo aquí.</p>
  <textarea class="typ" id="imp" rows="3" placeholder="MISION1:..."></textarea><button class="btn sec" id="impok" style="margin-top:0">Traer progreso</button><div class="fb" id="impfb"></div></details>`}
function wireClass(){
  const rel=$('#crel');if(rel)rel.onclick=()=>{CLASS_STATE='cargando';$('#clase').outerHTML=classBox();wireClass();loadClass()};
  const s=$('#fsend');if(s)s.onclick=sendScore;

    try{const t=$('#imp').value.trim();if(!t.startsWith('MISION1:'))throw 0;

      if(!o||!o.st)throw 0;localStorage.setItem('mision_u2',JSON.stringify(o.st));if(o.name)localStorage.setItem('mision_name',o.name);
      location.reload();
    }catch(e){$('#impfb').textContent='❌ Ese código no vale. Cópialo entero de la página antigua.'}};

async function sendScore(){
  if(SENDING)return;const fb=$('#sfb');
  if(!API_URL){fb.textContent='El ranking aún no está conectado.';return}
  const n=(lsGet('mision_name')||'').trim();if(!n){fb.textContent='Primero pon tu nombre.';return}
  const f=finalNota(),ex=nota('exam');
  const d={juego:GAME_ID,nombre:n,nota:f.miss?'':f.n,examen:ex==null?'':ex,xp:XP,estrellas:totalStars(),racha:BSTREAK,desglose:MIC.map(([k])=>BEST[k]||0).join('')};
  SENDING=true;fb.textContent='Enviando… 📤';
  try{const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(d)});const j=await r.json();if(!j.ok)throw 0;
    fb.textContent='✅ ¡Marca subida!';window._msg='✅ ¡Marca subida! Mira tu puesto.';confetti();loadClass();
  }catch(e){fb.textContent='❌ No se ha podido enviar. Revisa la conexión y prueba otra vez.'}
  SENDING=false;
}
function myCode(){
  const n=(lsGet('mision_name')||'').trim(),f=finalNota(),ex=nota('exam');
  const sb=MIC.map(([k])=>BEST[k]||0).join('');
  const core=[n,f.miss?'-':fmt(f.n),ex==null?'-':fmt(ex),XP,totalStars(),BSTREAK,sb].join('|');
  return `🏆 MISIÓN UNIT 2 (inglés)\nNombre: ${n}\nNota: ${f.miss?'pendiente':fmt(f.n)}\nExamen: ${ex==null?'sin hacer':fmt(ex)}\nXP: ${XP}\nEstrellas: ${totalStars()}/24\nRacha: ${BSTREAK}\nCódigo: ${core}#${chk(core)}`;
}

function wireFame(){
  $('#fsave').onclick=()=>{
    const n=($('#fn').value||'').trim().slice(0,20)||'Jugador';
    try{localStorage.setItem('mision_name',n)}catch(e){}

function examRun(qs){
  qs=qs.map(q=>({...q,opts:shuf(q.opts)}));let i=0,ok=0,wrong=[],left=600,done=false;
  app().innerHTML=`<div class="box"><h2>👑 EXAMEN FINAL</h2><p class="sub">Sin pistas. Las correcciones salen al final. Tienes 10 minutos.</p>
  <button class="btn" id="go">Empezar el examen ⏱️</button></div>`;
  $('#go').onclick=()=>{const t=setInterval(()=>{left--;const el=$('#clk');if(el)el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left<=0){clearInterval(t);finish(true)}},1000);
    function show(){if(done)return;if(i>=qs.length){clearInterval(t);return finish(false)}
      const q=qs[i];
      app().innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between"><h2>👑 Examen</h2><span class="pill" id="clk">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span></div>
      <div class="bar"><div style="width:${i/qs.length*100}%"></div></div><div class="hint">Pregunta ${i+1} de ${qs.length}</div>
      <div class="q">${esc(q.q)}</div><div class="opts">${q.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}</div></div>`;
      document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.textContent==q.a)ok++;else wrong.push({q:q.q,yo:b.textContent,a:q.a});i++;show()});}
    show();
    function finish(timeout){if(done)return;done=true;
      qs.slice(i).forEach(q=>wrong.push({q:q.q,yo:'(sin contestar)',a:q.a}));
      const g=grade('exam',ok/qs.length*10);setBest('exam',ok/qs.length);XP+=ok*10;hud();save();if(g>=7)confetti();
      app().innerHTML=`<div class="box center"><div class="big">${g>=9?'🏆':g>=7?'🥈':g>=5?'👍':'💪'}</div>
      <h2>${timeout?'⏰ ¡Tiempo! ':''}${ok} de ${qs.length}</h2><p style="font-size:26px;margin:4px">Nota: <b>${fmt(g)}</b> · ${label(g)} ${sem(g)}</p>
      <p class="sub">Nota prevista para el viernes (media de tus 3 últimos exámenes): <b>${fmt(nota('exam'))}</b></p></div>
      ${wrong.length?`<div class="box"><h2>📌 Repasa estas</h2><table class="rules">${wrong.map(w=>`<tr><td>${esc(w.q)}<br><span style="color:var(--no)">Tú: ${esc(w.yo)}</span> · <span style="color:var(--yes)">Bien: ${esc(w.a)}</span></td></tr>`).join('')}</table></div>`:''}
      <div class="center"><button class="btn" onclick="R.exam()">🔁 Otro examen</button> <button class="btn sec" onclick="home()">🏠 Menú</button></div>`;}
  };
}

/* Ordenar palabras */
function orderGame(title,sub,set,key,again,hint){
  let i=0,ok=0;
  function show(){
    if(i>=set.length)return endScreen('🧩',ok,set.length,key,again);
    const it=set[i],sol=it.w.join(' ');let built=[],first=true;
    const ch=shuf(it.w.map((w,k)=>({w,k})));
    app().innerHTML=`<div class="box"><h2>${title}</h2><p class="sub">${sub}</p>
    <div class="bar"><div style="width:${i/set.length*100}%"></div></div>
    <div class="hint">${i+1} de ${set.length} · 🇪🇸 ${esc(it.h)}</div>
    <div class="chips" id="dst"></div><div class="chips" id="src" style="background:transparent">${ch.map(c=>`<button class="chip" data-k="${c.k}">${esc(c.w)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div><button class="btn" id="chk">Comprobar ✔</button></div>`;
    function draw(){$('#dst').innerHTML=built.map((c,n)=>`<button class="chip" data-n="${n}">${esc(c.w)}</button>`).join('');
      document.querySelectorAll('#src .chip').forEach(b=>b.classList.toggle('used',built.some(c=>c.k==b.dataset.k)));
      document.querySelectorAll('#dst .chip').forEach(b=>b.onclick=()=>{built.splice(+b.dataset.n,1);draw()})}
    document.querySelectorAll('#src .chip').forEach(b=>b.onclick=()=>{built.push({w:b.textContent,k:b.dataset.k});draw()});
    $('#chk').onclick=()=>{
      if(built.length<it.w.length){$('#fb').textContent='Faltan palabras 😉';return}
      if(built.map(c=>c.w).join(' ')==sol){if(first)ok++;win();$('#fb').innerHTML='✅ ¡Perfecto! <b>'+esc(sol)+'</b>';$('#chk').textContent='Siguiente ➜';$('#chk').onclick=()=>{i++;show()}}
      else{first=false;lose();$('#dst').classList.add('shake');setTimeout(()=>$('#dst')&&$('#dst').classList.remove('shake'),400);$('#fb').innerHTML='❌ Casi. '+hint}
    };
  }
  show();
}
/* Escribir la respuesta */
const norm=s=>s.toLowerCase().replace(/[’`´]/g,"'").trim().replace(/\s+/g,' ');
function typeGame(title,sub,items,key,again,xp=15){
  let i=0,ok=0;
  function show(){
    if(i>=items.length)return endScreen('⌨️',ok,items.length,key,again);
    const it=items[i];
    app().innerHTML=`<div class="box"><h2>${title}</h2><p class="sub">${sub}</p>
    <div class="bar"><div style="width:${i/items.length*100}%"></div></div><div class="hint">${i+1} de ${items.length}</div>
    <div class="q">${it.q}</div>${it.sub?`<div class="hint">${it.sub}</div>`:''}
    <input class="typ" id="a" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Escribe aquí">
    <div class="fb" id="fb"></div><button class="btn" id="chk">Comprobar ✔</button></div>`;
    const inp=$('#a');inp.focus();
    const go=()=>{const v=norm(inp.value);if(!v){$('#fb').textContent='Escribe tu respuesta 😉';return}
      const parts=v.split('/').map(x=>x.trim()).filter(Boolean);const right=parts.length&&parts.every(p=>it.acc.includes(p));
      inp.classList.add(right?'ok':'bad');inp.disabled=true;
      if(right){ok++;win(xp);$('#fb').innerHTML='✅ ¡Genial! '+(it.ex||'')}else{lose();$('#fb').innerHTML='❌ Es: <b>'+esc(it.show)+'</b>. '+(it.ex||'')}
      $('#chk').textContent='Siguiente ➜';$('#chk').onclick=()=>{i++;show()};inp.onkeydown=e=>{if(e.key=='Enter')$('#chk').click()}};
    $('#chk').onclick=go;inp.onkeydown=e=>{if(e.key=='Enter')go()};
  }
  show();
}

/* Uno por adverbio + resto al azar */
function perAdv(pool,n){const first=ADV.map(a=>pick(pool.filter(x=>x.adv==a.w),1)[0]);return shuf([...first,...pick(pool.filter(x=>!first.includes(x)),n-first.length)])}
const pastOpts=v=>{const a=v[1][0];let o=[a,v[0]+(v[0].endsWith('e')?'d':'ed'),v[2][0],v[0]];o=[...new Set(o)];
  while(o.length<3){const x=pick(VERBS,1)[0][1][0];if(!o.includes(x))o.push(x)}return o};
const vocabSentQ=w=>{const f=w[4]||w[0];const DG={a:['n','b'],v:['n','a'],n:['a','b'],b:['n','v','a']};const others=shuf(VOCAB.filter(x=>DG[w[2]].includes(x[2]))).slice(0,3).map(x=>x[4]||x[0]);
  return{q:w[3].replace('___','_____'),opts:[f,...others],a:f,ex:`${w[0]} = ${w[1]}`}};
const vocabTransQ=w=>{const bad=new Set([w[1],...(SYN[w[0]]||[]).map(s=>VOCAB.find(x=>x[0]==s)[1])]);
  const others=shuf(VOCAB.filter(x=>!bad.has(x[1])&&x[2]==w[2])).slice(0,3);
  while(others.length<3){const x=pick(VOCAB,1)[0];if(!bad.has(x[1])&&!others.includes(x))others.push(x)}
  return{q:`¿Qué significa "${w[0]}"?`,opts:[w[1],...others.map(x=>x[1])],a:w[1]}};

     document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{

 },

 },
