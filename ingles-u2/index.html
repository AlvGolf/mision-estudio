/* Uno por adverbio + resto al azar */
function perAdv(pool,n){const first=ADV.map(a=>pick(pool.filter(x=>x.adv==a.w),1)[0]);return shuf([...first,...pick(pool.filter(x=>!first.includes(x)),n-first.length)])}
const pastOpts=v=>{const a=v[1][0];let o=[a,v[0]+(v[0].endsWith('e')?'d':'ed'),v[2][0],v[0]];o=[...new Set(o)];
  while(o.length<3){const x=pick(VERBS,1)[0][1][0];if(!o.includes(x))o.push(x)}return o};
const vocabSentQ=w=>{const f=w[4]||w[0];const DG={a:['n','b'],v:['n','a'],n:['a','b'],b:['n','v','a']};const others=shuf(VOCAB.filter(x=>DG[w[2]].includes(x[2]))).slice(0,3).map(x=>x[4]||x[0]);
  return{q:w[3].replace('___','_____'),opts:[f,...others],a:f,ex:`${w[0]} = ${w[1]}`}};
const vocabTransQ=w=>{const bad=new Set([w[1],...(SYN[w[0]]||[]).map(s=>VOCAB.find(x=>x[0]==s)[1])]);
  const others=shuf(VOCAB.filter(x=>!bad.has(x[1])&&x[2]==w[2])).slice(0,3);
  while(others.length<3){const x=pick(VOCAB,1)[0];if(!bad.has(x[1])&&!others.includes(x))others.push(x)}
  return{q:`¿Qué significa "${w[0]}"?`,opts:[w[1],...others.map(x=>x[1])],a:w[1]}};

  const like=()=>[...LIKE,...ING.map(x=>({q:`${x[0]} → -ing`,opts:[x[1],x[0]+'ing',x[0].replace(/e$/,'')+'ing',x[0]+x[0].slice(-1)+'ing'],a:x[1],ex:x[2]}))];
  const verbs=()=>VERBS.flatMap(v=>[
    {q:`Past simple de "${v[0]}" (${v[3]})`,opts:pastOpts(v),a:v[1][0],ex:`${v[0]} · ${v[1].join('/')} · ${v[2].join('/')}`},
    {q:`Past participle de "${v[0]}" (${v[3]})`,opts:[v[2][0],v[1][0],v[0]+(v[0].endsWith('e')?'d':'ed'),v[0]],a:v[2][0],ex:`${v[0]} · ${v[1].join('/')} · ${v[2].join('/')}`},
    {q:VSENT[v[0]].replace('___','_____')+` (${v[0]})`,opts:pastOpts(v),a:v[1][0],ex:`${v[0]} → ${v[1].join('/')}`}]);
  const vocab=()=>VOCAB.flatMap(w=>[vocabTransQ(w),vocabSentQ(w)]);
  const m={adv,like,verbs,vocab,mix:()=>[...adv(),...like(),...verbs(),...vocab()]};
    return m[k]();
  },
  deletreo(k){
  const verbs=()=>VERBS.flatMap(v=>[{q:`Past simple de "${v[0]}"`,h:v[3],a:v[1][0]},{q:`Past participle de "${v[0]}"`,h:v[3],a:v[2][0]}]);
  const like=()=>ING.map(x=>({q:`"${x[0]}" con -ing`,h:x[2],a:x[1]}));
  const adv=()=>ADV.map(a=>({q:`Adverbio del ${a.p}`,h:{always:'siempre',usually:'normalmente',often:'a menudo',sometimes:'a veces',never:'nunca'}[a.w],a:a.w}));
  const vocab=()=>VOCAB.filter(w=>w[0].length<=16&&!w[0].includes('(')).map(w=>({q:`¿Cómo se dice "${w[1]}"?`,h:'Vocabulario Unit 2',a:w[0]}));
  const m={adv,like,verbs,vocab,mix:()=>[...adv(),...like(),...verbs(),...vocab()]};
    return m[k]();
  },
 },
};
