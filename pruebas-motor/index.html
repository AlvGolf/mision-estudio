<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<body>
<header>
  <h1 onclick="home()">🧪 <span class="t-long">Pruebas del motor</span><span class="t-short">Pruebas</span></h1>
  <div class="hud"><span class="pill" id="xp">⭐ 0 XP</span><span class="pill" id="streak">🔥 0</span></div>
</header>
<main id="app"></main>

<script>
/* Juego de pruebas del motor común: una misión por cada formato nuevo, para que
   `npm run verificar` los juegue de verdad aunque ningún juego los use todavía.
   No está en el menú ni tiene ranking. Contenido de ejemplo de Inglés Unit 2. */

/* ================== DATOS ================== */
const ESCUCHA=[
 {say:'take photos',opts:['📷 take photos','📚 read books','🎬 watch films','⚽ play sports'],a:'📷 take photos'},
 {say:'Would you like to come to my party?',q:'¿Qué es lo que oyes?',opts:['💌 Una invitación','❤️ Una pregunta sobre gustos'],a:'💌 Una invitación'},
 {say:'I never sleep in a tent.',q:'¿Cuántas veces duerme en una tienda?',opts:['100 %','50 %','25 %','0 %'],a:'0 %'},
 {say:'She is brilliant at dancing.',q:'¿Qué se le da bien?',opts:['💃 Bailar','🍳 Cocinar','🎸 Tocar un instrumento'],a:'💃 Bailar'}];
const DICTADO=['I usually read books.','My sister hates taking photos.','Would you like to join the club?'];
const REPARA=[
 {w:['She','enjoy','reading','comics.'],bad:1,fix:['enjoys'],ex:'Con she/he/it el verbo lleva -s: she enjoys.'},
 {w:['Do','you','like','swiming?'],bad:3,fix:['swimming'],ex:'swim → swimming: se dobla la m.'},
 {w:['He','buyed','a','new','bike.'],bad:1,fix:['bought'],ex:'buy · bought · bought.'}];
const CRUCI=[
 [{n:1,d:'v',r:0,c:2,w:'caught',pista:'Past of catch'},{n:2,d:'v',r:1,c:5,w:'ate',pista:'Past of eat'},
  {n:3,d:'h',r:2,c:0,w:'bought',pista:'Past of buy'},{n:4,d:'h',r:5,c:0,w:'cut',pista:'Past of cut'}],
 [{n:1,d:'h',r:0,c:0,w:'drew',pista:'Past of draw'},{n:2,d:'v',r:0,c:3,w:'went',pista:'Past of go'},{n:3,d:'h',r:3,c:2,w:'ate',pista:'Past of eat'}]];
const PRIMERA=[
 {pre:'My sister hates ',w:'taking',post:' photos.',es:'tomar (fotos)'},
 {pre:'My little brother is ',w:'afraid',post:' of spiders.',es:'asustado'},
 {pre:'I love going camping in the ',w:'countryside',post:'.',es:'el campo'}];

const ESCENAS=[
 {q:'Lee y lleva a cada uno a su sitio',sitios:[{k:'cocina',l:'Kitchen'},{k:'teatro',l:'Theatre'},{k:'campamento',l:'Campsite'},{k:'campo',l:'Countryside'}],
  gente:[{n:'Tom',t:'Tom enjoys cooking.',z:'cocina',extra:'gorro'},{n:'Ana',t:'Ana would like to sleep in a tent.',z:'campamento',extra:'mochila'},
   {n:'Leo',t:'Leo is brilliant at acting.',z:'teatro',extra:'mascara'},{n:'Mia',t:'Mia loves taking photos of nature.',z:'campo',extra:'camara'},
   {n:'Sam',t:'Sam hates sports. He loves making cakes.',z:'cocina',extra:'libro'}]},
 {q:'Por la mañana: ¿dónde está cada uno?',luz:'dia',sitios:[{k:'campo',l:'Countryside'},{k:'teatro',l:'Theatre'},{k:'cocina',l:'Kitchen'}],
  gente:[{n:'Kim',t:'Kim is good at football. She plays every day in the fields.',z:'campo',extra:'balon',pein:'coleta',ropa:'#ff5c8a'},{n:'Ben',t:'Ben would like to be an actor.',z:'teatro',pein:'corto',ropa:'#3dd6ff'}]},
 {q:'Por la noche: ¿dónde está cada uno?',luz:'noche',sitios:[{k:'campamento',l:'Campsite'},{k:'cocina',l:'Kitchen'},{k:'teatro',l:'Theatre'}],
  gente:[{n:'Zoe',t:'Zoe is camping with her family.',z:'campamento',pein:'melena',ropa:'#ffc83d',pelo:'#2b1a0f'},{n:'Max',t:'Max is making dinner.',z:'cocina',extra:'gorro',pein:'corto',ropa:'#2ecc71'}]}];

const HISTORIA={titulo:'El Theatre Club',
 sitios:[{k:'cocina',l:'Home'},{k:'teatro',l:'Theatre'},{k:'campo',l:'Football pitch'}],
 reparto:[{n:'Lucy',pein:'coleta',ropa:'#ff5c8a',pelo:'#2b1a0f',piel:'#c98e62',extra:'mascara'},{n:'You',pein:'corto',ropa:'#3dd6ff'}],
 fin:'¡Ya eres del Theatre Club! El viernes es tu primera función.',
 nodos:[
  {relato:'Es lunes por la tarde. Lucy, tu compañera, llama a tu puerta con un cartel del Theatre Club. Quiere invitarte.',donde:{Lucy:'cocina',You:'cocina'},
   q:'¿Qué te dice Lucy?',opts:['Would you like to join the Theatre Club?','Do you like join the Theatre Club?'],a:'Would you like to join the Theatre Club?',repaso:'Para invitar: Would you like + to + verbo.'},
  {relato:'¡Te apetece mucho! Tienes que contestar a la invitación.',donde:{Lucy:'cocina',You:'cocina'},
   q:'¿Qué le contestas?',opts:['Yes, please! I’d love to.','Yes, I do.'],a:'Yes, please! I’d love to.',repaso:'«Yes, I do» contesta a Do you like…? A una invitación se responde «Yes, please! I’d love to».'},
  {relato:'El miércoles vais juntos al teatro. La profesora quiere saber qué te gusta hacer.',donde:{Lucy:'teatro',You:'teatro'},
   q:'Escribe la palabra que falta: «I enjoy ____ in front of people.» (act)',acc:['acting'],repaso:'Después de enjoy va siempre -ing: I enjoy acting.'},
  {relato:'Lucy te invita a ensayar el sábado por la mañana, pero ese día tienes partido de fútbol.',donde:{Lucy:'teatro',You:'campo'},
   q:'¿Qué le dices?',opts:['No, thanks. I’m afraid I’m busy.','Yes, please! I’d love to.'],a:'No, thanks. I’m afraid I’m busy.',repaso:'Si no puedes, se rechaza con educación: No, thanks. I’m afraid I’m busy.'},
  {relato:'Por la noche, en casa, Lucy te pregunta: «Do you like the Theatre Club?»',luz:'noche',donde:{Lucy:'cocina',You:'cocina'},
   q:'¿Qué le contestas?',opts:['Yes, I do.','Yes, please! I’d love to.'],a:'Yes, I do.',repaso:'A una pregunta con Do you like…? se contesta «Yes, I do» o «No, I don’t».'}]};

const SAM={quien:{n:'Sam',pein:'corto',ropa:'#2ecc71',pelo:'#1b1b1b',piel:'#8d5a3b',extra:'camara'},
 ficha:[['✅','loves taking photos'],['✅','is interested in nature'],['❌','hates horror films'],['➖','doesn’t like computer games']],
 agendaT:'Weekend',agenda:[['Sat','11:00 football'],['','afternoon: free'],['Sun','lunch with grandma (all day)']]};
const INVESTIGA=[
 {...SAM,q:'¿Qué plan le propones a Sam el sábado por la tarde?',sitios:[{k:'cocina',l:'Home'},{k:'teatro',l:'Theatre'},{k:'campo',l:'Countryside'}],
  opts:['Take photos in the countryside at 5 pm.','Watch a play at the theatre at 11 am.','Play computer games at home at 5 pm.'],a:'Take photos in the countryside at 5 pm.',
  planes:{'Take photos in the countryside at 5 pm.':'campo','Watch a play at the theatre at 11 am.':'teatro','Play computer games at home at 5 pm.':'cocina'},
  ex:'Le encantan las fotos y la naturaleza, y el sábado por la tarde está libre. A las 11 tiene fútbol y los videojuegos no le gustan.'},
 {...SAM,q:'Le invitas al cine el domingo. ¿Qué te contesta Sam?',opts:['Yes, please! I’d love to.','No, thanks. I’m afraid I’m busy.','Yes, I do.'],a:'No, thanks. I’m afraid I’m busy.',
  ex:'El domingo come con su abuela todo el día: está ocupado.'},
 {...SAM,q:'¿Cuál de estas frases es verdad sobre Sam?',opts:['Sam is interested in nature.','Sam loves horror films.','Sam is free on Sunday.'],a:'Sam is interested in nature.',
  ex:'La ficha dice «is interested in nature». Odia las pelis de miedo y el domingo está ocupado.'}];

/* Formatos de Mates y Lengua (21-nov): contenido de ejemplo, no de ningún temario */
const NUMEROS=[
 {q:'7,5 + 2,25 = ?',a:'9,75'},
 {q:'Hay 48 lápices para 6 niños. ¿Cuántos le tocan a cada uno?',a:8},
 {q:'Hace 3 grados bajo cero. Escribe la temperatura.',a:-3,neg:true,ex:'Bajo cero se escribe con el signo menos: −3.'}];
const RECTAS=[
 {q:'Toca dónde va el 2,7',min:2,max:3,tic:.1,paso:.05,val:2.7,et:[2,2.5,3]},
 {q:'Toca dónde va la fracción 3/4',min:0,max:1,tic:.125,paso:.125,val:.75,et:[0,1]},
 {q:'Toca dónde va el −3',min:-5,max:5,tic:1,paso:1,val:-3,et:[-5,0,5]}];
const CADENAS=[{ini:12,ops:[['×',3],['−',6],['÷',5],['+',0.5]]},{ini:100,ops:[[':',4],['+',15],['×',2]]}];
const TABLAS=[
 {q:'Conjuga «cantar» en presente',cab:['Persona','Presente'],tildes:true,f:[['yo','canto',1],['tú','cantas'],['él / ella','canta',1],['nosotros','cantamos'],['vosotros','cantáis'],['ellos / ellas','cantan',1]]},
 {q:'Multiplica y divide por la unidad seguida de ceros',cab:['Operación','Resultado'],num:true,f:[['3,5 × 10','35'],['3,5 × 100','350'],['3,5 × 1000','3500'],['3,5 : 10','0,35']]}];
const MARCAS=[
 {q:'Marca los adjetivos',texto:'El perro pequeño corre por el parque verde.',si:['pequeño','verde']},
 {q:'Marca los verbos',texto:'Ayer mi hermano leyó un libro y después escribió una carta.',si:['leyó','escribió']}];
const SILABAS=[{w:'camión',c:[2],ton:1},{w:'lápiz',c:[2],ton:0},{w:'murciélago',c:[3,6,8],ton:1},{w:'sol',c:[]}];
const CAJAS2=[{q:'Clasifica cada palabra',fil:['Aguda','Llana'],col:['Con tilde','Sin tilde'],
 w:[['camión',0,0],['sofá',0,0],['reloj',0,1],['pared',0,1],['lápiz',1,0],['árbol',1,0],['mesa',1,1],['casa',1,1]]}];

/* Cuentas en pantalla (21-nov): divisiones en cuadrícula y problemas con la cuenta montada */
const DIVIS=[{D:7488,d:32,modo:'guiada'},{D:958,d:7,modo:'guiada'},{D:6350,d:45,modo:'libre'}];
const PROBS=[
 {q:'En un almacén hay 1.344 botellas y se guardan en cajas de 24. ¿Cuántas cajas se llenan?',a:56,cuenta:[1344,':',24]},
 {q:'Un cine tiene 18 filas de 26 butacas. ¿Cuántas butacas hay?',a:468,cuenta:[18,'×',26]},
 {q:'Una tienda tenía 2.050 € y gasta 875 €. ¿Cuánto le queda?',a:1175,cuenta:[2050,'−',875]}];

/* Reloj de agujas (22-nov, «Las horas del reloj», 2º): los cuatro modos, de cuarto en cuarto y de cinco en cinco, con el cole en la escena */
const ESC_RELOJ=d=>({sitios:[{k:'cocina',l:'Casa'},{k:'cole',l:'Cole'},{k:'campo',l:'Parque'}],donde:d,luz:'dia',quien:{n:'Lía',pein:'coleta',ropa:'#ff5c8a',extra:'mochila'}});
const RELOJES=[
 {modo:'leer',h:9,m:15,paso:15,relato:'Empieza la clase.',escena:ESC_RELOJ('cole')},
 {modo:'poner',h:7,m:30,paso:15,relato:'Pon el despertador.',escena:ESC_RELOJ('cocina')},
 {modo:'leer',h:6,m:40,paso:5},
 {modo:'poner',h:4,m:35,paso:5},
 {modo:'elige',h:3,m:45,paso:15,relato:'Al revés: la hora en palabras.',escena:ESC_RELOJ('cole')},
 {modo:'elige',h:6,m:0,paso:15},
 {modo:'dura',h:10,m:0,mas:60,relato:'La clase dura una hora.',q:'¿A qué hora termina?',escena:ESC_RELOJ('cole')},
 {modo:'ordena',q:'Toca en orden',eventos:[{t:'Desayuna',ic:'🥣',h:8,m:15},{t:'Recreo',ic:'⚽',h:11,m:30},{t:'Cole',ic:'🏫',h:9,m:0}],escena:ESC_RELOJ('campo')}];

/* ================== BLOQUES CON NOTA Y ESTRELLAS ================== */
const BLOCKS=[{k:'escuchar',n:'Escucha y elige',w:1},{k:'dictado',n:'Dictado',w:1},{k:'reparar',n:'Detecta y repara',w:1},{k:'cruci',n:'Crucigrama',w:1},{k:'letra',n:'Primera letra',w:1},{k:'escena',n:'Construir una escena',w:1},{k:'historia',n:'Historia',w:1},{k:'investiga',n:'Miniinvestigación',w:1},
 {k:'numero',n:'Número',w:1},{k:'recta',n:'Recta numérica',w:1},{k:'cadena',n:'Cálculo en cadena',w:1},{k:'tabla',n:'Completar tablas',w:1},{k:'marcar',n:'Marcar palabras',w:1},{k:'silabas',n:'Sílabas',w:1},{k:'cajas2',n:'Cajas 2×2',w:1},{k:'divis',n:'Divisiones',w:1},{k:'probs',n:'Problemas',w:1},{k:'reloj',n:'Reloj de agujas',w:1}];
const MIC=[['escuchar','🎧'],['dictado','✍️'],['reparar','🛠️'],['cruci','🧩'],['letra','🔡'],['escena','🏞️'],['historia','📖'],['investiga','🔎'],['numero','🔢'],['recta','📏'],['cadena','⛓️'],['tabla','📋'],['marcar','🖍️'],['silabas','✂️'],['cajas2','🗃️'],['divis','➗'],['probs','📝'],['reloj','🕗'],['exam','👑'],['arcade','🎮']];

/* ================== MISIONES ================== */
const R={
 escuchar(){runSteps('🎧 Escucha y elige',shuf(ESCUCHA).map(x=>({t:'listen',...x,sub:'Toca 🔊 para oírlo otra vez'})),'escuchar',R.escuchar,'🎧')},
 dictado(){runSteps('✍️ Dictado',DICTADO.map(f=>({t:'dictado',say:f,sub:'No cuentan las mayúsculas ni los puntos'})),'dictado',R.dictado,'✍️')},
 reparar(){runSteps('🛠️ Detecta y repara',shuf(REPARA).map(x=>({t:'repair',...x})),'reparar',R.reparar,'🛠️')},
 cruci(){runSteps('🧩 Crucigrama',CRUCI.map(w=>({t:'cross',words:w,sub:'Toca una pista o una casilla y escribe'})),'cruci',R.cruci,'🧩')},
 escena(){runSteps('🏞️ Construir una escena',ESCENAS.map(x=>({t:'scene',...x,sub:'Toca a una persona y luego su sitio'})),'escena',R.escena,'🏞️')},
 historia(){runSteps('📖 Historia',[{t:'story',...HISTORIA,sub:'Cada decisión es un ejercicio'}],'historia',R.historia,'📖')},
 investiga(){runSteps('🔎 Miniinvestigación',INVESTIGA.map(x=>({t:'probe',...x,sub:'Mira la ficha y la agenda antes de decidir'})),'investiga',R.investiga,'🔎')},
 letra(){runSteps('🔡 Primera letra',shuf(PRIMERA).map(x=>({t:'first',...x,sub:'Escribe la palabra; la primera letra ya está'})),'letra',R.letra,'🔡')},
 numero(){runSteps('🔢 Responder con un número',NUMEROS.map(x=>({t:'num',...x,sub:'Escribe con el teclado de números'})),'numero',R.numero,'🔢')},
 recta(){runSteps('📏 Recta numérica',RECTAS.map(x=>({t:'recta',...x,sub:'Toca la recta y comprueba'})),'recta',R.recta,'📏')},
 cadena(){runSteps('⛓️ Cálculo en cadena',CADENAS.map(x=>({t:'cadena',...x,sub:'Cada resultado es el comienzo del siguiente'})),'cadena',R.cadena,'⛓️')},
 tabla(){runSteps('📋 Completar tablas',TABLAS.map(x=>({t:'tabla',...x,sub:'Escribe lo que falta en cada fila'})),'tabla',R.tabla,'📋')},
 marcar(){runSteps('🖍️ Marcar palabras',MARCAS.map(x=>({t:'marcar',...x,sub:'Toca las palabras y comprueba'})),'marcar',R.marcar,'🖍️')},
 silabas(){runSteps('✂️ Separar en sílabas',SILABAS.map(x=>({t:'silabas',...x,sub:'Toca entre las letras para cortar'})),'silabas',R.silabas,'✂️')},
 divis(){runSteps('➗ Divisiones',DIVIS.map(x=>({t:'divi',...x,sub:x.modo=='guiada'?'Paso a paso':'Como en la hoja'})),'divis',R.divis,'➗')},
 probs(){runSteps('📝 Problemas',PROBS.map(x=>({t:'prob',...x,sub:'Monta la cuenta y escribe la respuesta'})),'probs',R.probs,'📝')},
 reloj(){runSteps('🕗 Reloj de agujas',RELOJES.map(x=>({t:'reloj',...x,sub:'Lee, pon y ordena las horas'})),'reloj',R.reloj,'🕗')},
 cajas2(){runSteps('🗃️ Clasificar con dos criterios',CAJAS2.map(x=>({t:'cajas2',...x,sub:'Cada ficha tiene una sola caja'})),'cajas2',R.cajas2,'🗃️')},
};
const ROUTE_ST=[
 {k:'dictado',n:'Dictado',ic:'✍️',min:3},{k:'cruci',n:'Crucigrama',ic:'🧩',min:3},{k:'reparar',n:'Detecta y repara',ic:'🛠️',min:2},
 {k:'letra',n:'Primera letra',ic:'🔡',min:2},{k:'escuchar',n:'Escucha y elige',ic:'🎧',min:2},{k:'escena',n:'Construir una escena',ic:'🏞️',min:2},{k:'historia',n:'Historia',ic:'📖',min:3},{k:'investiga',n:'Miniinvestigación',ic:'🔎',min:2},
 {k:'cadena',n:'Cálculo en cadena',ic:'⛓️',min:2},{k:'tabla',n:'Completar tablas',ic:'📋',min:2},{k:'silabas',n:'Sílabas',ic:'✂️',min:2},{k:'marcar',n:'Marcar palabras',ic:'🖍️',min:2},
 {k:'cajas2',n:'Cajas 2×2',ic:'🗃️',min:2},{k:'recta',n:'Recta numérica',ic:'📏',min:1},{k:'numero',n:'Número',ic:'🔢',min:1},
 {k:'divis',n:'Divisiones',ic:'➗',min:3},{k:'probs',n:'Problemas',ic:'📝',min:3},{k:'reloj',n:'Reloj de agujas',ic:'🕗',min:2}];

/* ================== CONFIGURACIÓN PARA EL MOTOR ================== */
const MC=[
 {q:'Past of buy',opts:['bought','buyed','brought'],a:'bought'},{q:'Past of eat',opts:['ate','eated','eat'],a:'ate'},
 {q:'She ____ reading.',opts:['enjoys','enjoy','enjoying'],a:'enjoys'},{q:'swim + -ing',opts:['swimming','swiming','swimeing'],a:'swimming'},
 {q:'"countryside" es…',opts:['el campo','la ciudad','la costa'],a:'el campo'}];
const JUEGO={
 id:'pruebas-motor',codigo:'PRUEBAS DEL MOTOR',ranking:false,voz:'en-GB',tildesCuentan:false,
 curso:5, estilo:0,
 claves:{estado:'pruebas_motor',ruta:'pruebas_motor_ruta',arcade:'pruebas_motor_arcade',nombre:'mision_name'},
 saludo:'Juego de pruebas: una misión por cada formato nuevo del motor.',
 notaBoletin:'Solo cuenta la primera respuesta.',
 menu:[['#','🧪 Formatos nuevos'],['escuchar','🎧','Escucha y elige','Oye y toca'],['dictado','✍️','Dictado','Oye y escribe'],
  ['reparar','🛠️','Detecta y repara','Encuentra y arregla'],['cruci','🧩','Crucigrama','Verbos irregulares'],['letra','🔡','Primera letra','Escribe con pista'],['escena','🏞️','Construir una escena','Lee y coloca'],['historia','📖','Historia','El Theatre Club'],['investiga','🔎','Miniinvestigación','La agenda de Sam'],
  ['#','🧮 Mates y Lengua'],['numero','🔢','Número','Teclado con coma'],['recta','📏','Recta numérica','Decimales y fracciones'],['cadena','⛓️','Cálculo en cadena','Paso a paso'],
  ['tabla','📋','Completar tablas','Verbos y ceros'],['marcar','🖍️','Marcar palabras','Adjetivos y verbos'],['silabas','✂️','Sílabas','Y la tónica'],['cajas2','🗃️','Cajas 2×2','Aguda o llana, con tilde o sin'],
  ['divis','➗','Divisiones','Guiadas y libres'],['probs','📝','Problemas','Con la cuenta montada'],['reloj','🕗','Reloj de agujas','Leer, elegir, poner, durar y ordenar'],
  ['#','👑 Examen'],['exam','👑','EXAMEN','5 preguntas'],['#','🎮 Arcade'],['arcade','🎮','Arcade','Para probar que sigue funcionando']],
 chuleta:'',
 examen:{min:3,dia:'el examen',preguntas(){return shuf([...MC,{q:'Calcula 7 × 8 (con teclado y borrador)',a:56,num:true,borrador:true}])}},
 ruta:{partes:[],estacion(){}},
 arcade:{bloques:[{k:'mix',n:'Todo mezclado',ic:'🎲'}],jefes:{mix:['🦖','Rex de pruebas']},
  test(){return MC.map(q=>({...q}))},deletreo(){return [{q:'Past of buy',h:'comprar',a:'bought'},{q:'Past of eat',h:'comer',a:'ate'}]}},
};
</script>
