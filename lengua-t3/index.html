/* Lengua Unidad 3 (5º): el adjetivo y sus grados, los epítetos, el vocabulario (sinónimos y antónimos, monosémicas,
   polisémicas, homónimas y parónimas), diptongos, triptongos e hiatos y la medida de los versos. Examen el 1-dic-2026.
   Decidido con el padre el 24-nov (artefacto «Juego de Lengua de 5º», F1 y ronda 2): un formato para cada cosa,
   la ruta en el orden del libro (de lo más sencillo a lo más difícil, las definiciones al final para repasar),
   las tildes cuentan y cada partida saca ejercicios al azar de un banco grande. Frases y poemas nuevos; los ejemplos
   del libro, en las definiciones y en el examen. Ningún nombre de niño ni del colegio. */

/* ================== DATOS ================== */
/* Sílabas: se escriben con guiones («te-a-tro») y se pasan al paso «silabas» ({w, c}) */

const T=(q,acc,ex)=>({q,acc:Array.isArray(acc)?acc:[acc],show:Array.isArray(acc)?acc[0]:acc,ex});

/* 1 · El adjetivo y la concordancia */

 chuleta:`<div class="box"><h2>📘 Chuleta rápida</h2>
<table class="rules">
<tr><td><b>Adjetivo:</b> dice cómo son o cómo están. Tiene género y número y concuerda con su sustantivo (las fresas deliciosas).</td></tr>
<tr><td><b>Grados:</b> positivo (alegre) · comparativo de inferioridad (menos alta que), igualdad (tan amable como) y superioridad (más rápido que) · superlativo (lentísimo, muy ordenada).</td></tr>
<tr><td><b>Epíteto:</b> va delante y dice una cualidad propia (blanca nieve, caluroso verano).</td></tr>
<tr><td><b>Sinónimos:</b> casi igual (alegre, feliz). <b>Antónimos:</b> lo contrario (lleno, vacío). <b>Monosémica:</b> un significado (silla). <b>Polisémica:</b> varios (banco).</td></tr>
<tr><td><b>Homónimas:</b> suenan igual; homógrafas (se escriben igual) y homófonas (vaca, baca). <b>Parónimas:</b> casi igual (asar, azar).</td></tr>
<tr><td><b>Diptongo:</b> dos vocales, una sílaba (miér-co-les). <b>Triptongo:</b> tres (a-ve-ri-guáis). <b>Hiato:</b> sílabas distintas (te-a-tro, dí-a, po-se-er). Abiertas: a, e, o · cerradas: i, u.</td></tr>
<tr><td><b>Versos:</b> sinalefa (vocal + vocal o h = una sílaba) · aguda +1 · esdrújula −1 · arte menor: 8 o menos · arte mayor: 9 o más.</td></tr>
</table></div>`,
