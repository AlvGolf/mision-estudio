<script>
/* Las horas del reloj (2º): un día con Lía. Elegido por el padre el 22-nov en el artefacto «El reloj de 2º» (P2).
   Sin temario del cole. Solo el nivel 1: en punto, y cuarto, y media y menos cuarto (el padre, 22-nov: en clase aún
   no han pasado de ahí). Lo de cinco en cinco irá en un juego aparte, «Reloj nivel 2», con su propia ruta.
   Sin «de la mañana» ni «de la tarde»: lo que se ordena va siempre dentro de la mañana o dentro de la tarde.
   El motor común (../motor/motor.js) se carga al final y arranca el juego. */

/* ================== DATOS ================== */
const LIA={n:'Lía',pein:'coleta',ropa:'#ff5c8a',pelo:'#5a3a1a',piel:'#f2c9a0',extra:'mochila'};
const SITIOS=[{k:'cocina',l:'Casa'},{k:'cole',l:'Cole'},{k:'campo',l:'Parque'}];
const esc_=(donde,luz)=>({sitios:SITIOS,donde,luz:luz||'dia',quien:LIA,l:'El día de Lía'});

/* Nivel 1 · leer la hora (dos de cada: en punto, y media, y cuarto, menos cuarto) */
const LEER1=[
 {h:8,m:0,relato:'Lía se despierta. Mira su despertador.',escena:esc_('cocina')},
 {h:8,m:30,relato:'Lía desayuna en la cocina.',escena:esc_('cocina')},
 {h:9,m:15,relato:'En el cole empieza la clase de lectura.',escena:esc_('cole')},
 {h:10,m:45,relato:'Lía mira el reloj de la clase.',escena:esc_('cole')},
 {h:12,m:0,relato:'Suena el timbre del cole.',escena:esc_('cole')},
 {h:4,m:30,relato:'Por la tarde, Lía juega en el parque.',escena:esc_('campo','atardecer')},
 {h:5,m:15,relato:'Lía merienda en el banco del parque.',escena:esc_('campo','atardecer')},
 {h:7,m:45,relato:'Lía vuelve a casa para cenar.',escena:esc_('cocina','atardecer')}];
/* Nivel 1 · poner la hora */
const PONER1=[
 {h:7,m:30,relato:'Mañana Lía tiene que levantarse pronto. Ayúdala a poner el despertador.',escena:esc_('cocina')},
 {h:9,m:0,relato:'El cole empieza a las 9 en punto. Pon el reloj de la entrada.',escena:esc_('cole')},
 {h:11,m:30,relato:'El recreo es a las 11 y media.',escena:esc_('cole')},
 {h:1,m:15,relato:'Lía come en el comedor a la 1 y cuarto.',escena:esc_('cole')},
 {h:3,m:45,relato:'Sale del cole a las 4 menos cuarto.',escena:esc_('cole','atardecer')},
 {h:6,m:0,relato:'En el parque hay un cumpleaños a las 6 en punto.',escena:esc_('campo','atardecer')},
 {h:8,m:15,relato:'Lía se baña a las 8 y cuarto.',escena:esc_('cocina','noche')},
 {h:8,m:45,relato:'Y se acuesta a las 9 menos cuarto.',escena:esc_('cocina','noche')}];
/* Ordenar el día (cada uno dentro de la mañana o dentro de la tarde) */
const ORDENA=[
 {q:'¿Qué hace Lía primero por la mañana? Toca las cosas en orden.',escena:esc_('cocina'),eventos:[{t:'Se despierta',ic:'🛏️',h:7,m:45},{t:'Desayuna',ic:'🥣',h:8,m:15},{t:'Va al cole',ic:'🏫',h:9,m:0}]},
 {q:'En el cole: toca las cosas en orden.',escena:esc_('cole'),eventos:[{t:'Lectura',ic:'📖',h:9,m:15},{t:'Recreo',ic:'⚽',h:11,m:30},{t:'Música',ic:'🎵',h:10,m:0},{t:'Mates',ic:'➗',h:11,m:45}]},
 {q:'Por la tarde: toca las cosas en orden.',escena:esc_('campo','atardecer'),eventos:[{t:'Come',ic:'🍽️',h:2,m:0},{t:'Parque',ic:'🛝',h:5,m:30},{t:'Cena',ic:'🍲',h:8,m:0},{t:'Deberes',ic:'✏️',h:4,m:15}]}];
/* ¿Qué reloj es? Al revés que leer: la hora en palabras y tres relojes para elegir */
const ELIGE=[
 {h:7,m:15,relato:'Suena el despertador de Lía.',escena:esc_('cocina')},
 {h:8,m:45,relato:'Lía sale de casa hacia el cole.',escena:esc_('cocina')},
 {h:10,m:0,relato:'Empieza la clase de música.',escena:esc_('cole')},
 {h:10,m:30,relato:'La profesora reparte los cuadernos.',escena:esc_('cole')},
 {h:12,m:15,relato:'Lía guarda sus cosas en la mochila.',escena:esc_('cole')},
 {h:1,m:45,relato:'Lía sale del comedor.',escena:esc_('cole')},
 {h:5,m:0,relato:'Lía llega al parque.',escena:esc_('campo','atardecer')},
 {h:6,m:30,relato:'Lía se toma un zumo en el banco.',escena:esc_('campo','atardecer')}];
/* Poner la hora de la tarde: otras horas, del cole al parque y a casa */
const PONERT=[
 {h:3,m:0,relato:'La clase de pintura empieza a las 3 en punto.',escena:esc_('cole','atardecer')},
 {h:4,m:15,relato:'Lía llega al parque a las 4 y cuarto.',escena:esc_('campo','atardecer')},
 {h:4,m:45,relato:'Su amigo Leo llega a las 5 menos cuarto.',escena:esc_('campo','atardecer')},
 {h:5,m:30,relato:'Meriendan juntos a las 5 y media.',escena:esc_('campo','atardecer')},
 {h:6,m:45,relato:'Lía vuelve a casa a las 7 menos cuarto.',escena:esc_('cocina','atardecer')},
 {h:7,m:15,relato:'Ayuda a poner la mesa a las 7 y cuarto.',escena:esc_('cocina','atardecer')},
 {h:9,m:30,relato:'Su padre le lee un cuento a las 9 y media.',escena:esc_('cocina','noche')},
 {h:10,m:0,relato:'A las 10 en punto, Lía ya duerme.',escena:esc_('cocina','noche')}];
/* ¿Cuánto dura? (una hora o media hora después) */
const DURA=[
 {h:10,m:0,mas:60,relato:'La clase de música empieza a las 10 en punto y dura una hora.',q:'¿A qué hora termina?',escena:esc_('cole')},
 {h:9,m:15,mas:30,relato:'La clase de lectura empieza a las 9 y cuarto y dura media hora.',q:'¿A qué hora termina?',escena:esc_('cole')},
 {h:11,m:30,mas:60,relato:'Lía empieza un dibujo a las 11 y media. Tarda una hora.',q:'¿A qué hora lo acaba?',escena:esc_('cole')},
 {h:5,m:0,mas:30,relato:'Lía llega al parque a las 5 en punto y juega media hora.',q:'¿A qué hora se va?',escena:esc_('campo','atardecer')},
 {h:3,m:45,mas:60,relato:'La clase de natación empieza a las 4 menos cuarto y dura una hora.',q:'¿A qué hora termina?',escena:esc_('campo','atardecer')},
 {h:7,m:30,mas:30,relato:'La cena empieza a las 7 y media y dura media hora.',q:'¿A qué hora acaban de cenar?',escena:esc_('cocina','atardecer')}];

/* ================== BLOQUES CON NOTA Y ESTRELLAS ================== */
const BLOCKS=[{k:'leer1',n:'Leer la hora',w:1},{k:'poner1',n:'Poner la hora',w:2},{k:'ordena',n:'Ordenar el día',w:1},
 {k:'elige',n:'¿Qué reloj es?',w:1},{k:'tarde',n:'Poner la hora de la tarde',w:2},{k:'dura',n:'¿Cuánto dura?',w:1}];
const MIC=[['leer1','🕗'],['poner1','✋'],['ordena','📅'],['elige','🔍'],['tarde','🌇'],['dura','⏳'],['exam','👑']];

const paso=(x,modo,p)=>({t:'reloj',modo,paso:p,...x});

/* ================== MISIONES ================== */
const R={
 leer1(){runSteps('🕗 Leer la hora',pick(LEER1,6).map(x=>paso(x,'leer',15)),'leer1',R.leer1,'🕗')},
 poner1(){runSteps('✋ Poner la hora',pick(PONER1,6).map(x=>paso(x,'poner',15)),'poner1',R.poner1,'✋')},
 ordena(){runSteps('📅 Ordenar el día',ORDENA.map(x=>paso(x,'ordena',15)),'ordena',R.ordena,'📅')},
 elige(){runSteps('🔍 ¿Qué reloj es?',pick(ELIGE,6).map(x=>paso(x,'elige',15)),'elige',R.elige,'🔍')},
 tarde(){runSteps('🌇 Poner la hora de la tarde',pick(PONERT,6).map(x=>paso(x,'poner',15)),'tarde',R.tarde,'🌇')},
 dura(){runSteps('⏳ ¿Cuánto dura?',pick(DURA,5).map(x=>paso(x,'dura',15)),'dura',R.dura,'⏳')},
};
/* La ruta en dos días de unos 17 minutos: el primero, leer, poner y ordenar; el segundo, elegir el reloj, la tarde y ¿cuánto dura? */
const ROUTE_ST=[{k:'leer1',n:'Leer la hora',ic:'🕗',min:6},{k:'poner1',n:'Poner la hora',ic:'✋',min:7},{k:'ordena',n:'Ordenar el día',ic:'📅',min:4,corte:'Hasta aquí el primer día'},
 {k:'elige',n:'¿Qué reloj es?',ic:'🔍',min:5},{k:'tarde',n:'Poner la hora de la tarde',ic:'🌇',min:6},{k:'dura',n:'¿Cuánto dura?',ic:'⏳',min:5}];

/* ================== EXAMEN: 10 relojes, mitad leer y mitad poner, de cuarto en cuarto ================== */
function preguntasExamen(){const p=15,M=[...Array(60/p).keys()].map(i=>i*p),vistas=new Set(),hs=[];
  while(hs.length<10){const h=1+Math.floor(Math.random()*12),m=M[Math.floor(Math.random()*M.length)];if(!vistas.has(h+':'+m)){vistas.add(h+':'+m);hs.push([h,m])}}
  return hs.map(([h,m],i)=>i<5?{q:'¿Qué hora marca el reloj?',reloj:{h,m},opts:[horaTxt(h,m),...horaFalsas(h,m,p)].map(Mayus),a:Mayus(horaTxt(h,m))}
    :{q:`Pon las agujas: ${horaTxt(h,m)}`,poner:{h,m,paso:p},a:horaTxt(h,m)})}

/* ================== CONFIGURACIÓN PARA EL MOTOR ================== */
const JUEGO={
 id:'mates-reloj',
 marca:'Las horas del reloj',
 codigo:'MISIÓN RELOJ · 2º',
 curso:2, estilo:2, voz:'es-ES', tildesCuentan:false,
 claves:{estado:'mates_reloj',ruta:'mates_reloj_ruta',arcade:'mates_reloj_arcade',nombre:'mision_name_2'},
 saludo:'Un día con Lía, reloj en mano. La aguja corta dice la hora y la larga, los minutos.',
 notaBoletin:'Solo cuenta la primera respuesta. Poner la hora vale doble, porque es lo que más se pide.',
 menu:[
   ['#','🕗 Primer día'],
   ['leer1','🕗','Leer la hora','¿Qué hora marca?'],
   ['poner1','✋','Poner la hora','Mueve las agujas'],
   ['ordena','📅','Ordenar el día','¿Qué pasa antes?'],
   ['#','🌇 Segundo día'],
   ['elige','🔍','¿Qué reloj es?','Busca el que marca la hora'],
   ['tarde','🌇','Poner la hora de la tarde','Del cole al parque'],
   ['dura','⏳','¿Cuánto dura?','Una hora después…'],
   ['#','👑 Examen'],
   ['exam','👑','EXAMEN FINAL','10 relojes, sin prisa'],
 ],
 chuleta:`<div class="box"><h2>📘 Chuleta del reloj</h2>
<table class="rules">
<tr><td>La aguja <b style="color:#5b7cf0">corta</b> dice la <b>hora</b>. La <b style="color:#ff6b7c">larga</b>, los <b>minutos</b>.</td></tr>
<tr><td>Larga en el <b>12</b>: en punto · en el <b>3</b>: y cuarto · en el <b>6</b>: y media · en el <b>9</b>: menos cuarto.</td></tr>
<tr><td>Con «menos», la hora es la que <b>viene</b>: las 7 menos cuarto es casi las 7.</td></tr>
<tr><td><b>Una hora</b> después, la corta avanza un número. <b>Media hora</b> después, la larga da media vuelta.</td></tr>
</table></div>`,
 examen:{min:0,dia:'el examen',preguntas:preguntasExamen},
 ruta:{facil:true,minutos:'dos días de unos 17',partes:[],estacion(){},textoFin:'Ahora, el examen: 10 relojes, sin prisa.'},
 /* Sin arcade por ahora (el padre, 22-nov: «más adelante»); el motor necesita su configuración */
 arcade:{bloques:[{k:'mix',n:'Todo mezclado',ic:'🎲'}],jefes:{mix:['🦖','Rex del reloj']},test(){return []},deletreo(){return []}},
};
</script>
<script src="cifras.js?v=1"></script>
